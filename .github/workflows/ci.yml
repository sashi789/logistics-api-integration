name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          POSTGRES_DB: logistics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logistics" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://logistics:logistics@localhost:5432/logistics
      TEST_DATABASE_URL: postgresql://logistics:logistics@localhost:5432/logistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
